<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administrador - SiGeRU</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/admin.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div>
                <div class="admin-brand">
                    <div class="admin-logo">SR</div>

                    <div>
                        <h1>SiGeRU</h1>
                        <p>Panel administrador</p>
                    </div>
                </div>

                <nav class="admin-menu">
                    <button class="admin-menu-link active" data-module="resumen">Resumen</button>
                    <button class="admin-menu-link" data-module="incidencias">Incidencias</button>
                    <button class="admin-menu-link" data-module="contenedores">Contenedores</button>
                    <button class="admin-menu-link" data-module="camiones">Camiones</button>
                    <button class="admin-menu-link" data-module="funcionarios">Funcionarios</button>
                </nav>
            </div>

            <a href="index.html" class="admin-salir">Salir</a>
        </aside>

        <main class="admin-main">

            <section class="module-header">
                <div>
                    <p class="admin-etiqueta">Administrador</p>
                    <h2 id="moduleTitle">Resumen general</h2>
                    <p id="moduleDescription">
                        Vista inicial del estado general del sistema.
                    </p>
                </div>
            </section>

            <section id="summaryCards" class="admin-resumen"></section>

            <section id="moduleTools" class="module-tools">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Buscar por ID, zona, ubicación o estado..."
                >

                <select id="stateFilter">
                    <option value="todos">Todos los estados</option>
                </select>

                <button type="button" id="newRecordBtn" class="btn-principal">Nuevo</button>
            </section>

            <section class="module-content">
                <div id="moduleList" class="data-list"></div>

                <aside id="detailPanel" class="detail-panel">
                    <p class="detail-empty">
                        Seleccione un registro para ver más información.
                    </p>
                </aside>
            </section>
        </main>
    </div>

    <div id="formModal" class="modal-overlay oculto">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitulo">Nuevo registro</h3>
                <button type="button" id="modalCerrar" class="modal-cerrar" aria-label="Cerrar">✕</button>
            </div>

            <form id="formAlta">
                <div class="form-grid" id="modalFormFields"></div>

                <div class="modal-actions">
                    <button type="button" id="modalCancelar" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-principal">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/admin/main.js"></script>
</body>
</html>
